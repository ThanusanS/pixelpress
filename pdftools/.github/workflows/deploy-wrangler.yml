name: Build and Deploy (Wrangler)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Publish to Cloudflare Workers (Workers Sites)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          # Ensure the build output exists
          ls -la frontend/build
          # Use npx so the right Wrangler is used; pass account id via env
          npx wrangler publish --account-id $CF_ACCOUNT_ID
