# Wrangler config for deploying frontend as a Workers Site
# Replace the placeholder account_id with your Cloudflare account ID or
# set the secret `CF_ACCOUNT_ID` in your CI and use the workflow below.
name = "pdftools"
compatibility_date = "2026-03-23"
workers_dev = true

[site]
bucket = "./frontend/build"
# entry-point is optional for classic Workers Sites; leave default
